# ==============================================================
# YYC³ manju-studio · Mac 本地开发全栈（M0 新建，原为 0 字节占位）
# 用途：pnpm 侧开发之外的一键全栈空壳（web/api/redis/postgres/celery）
# 启动：docker compose -f docker-compose.mac.yml up --build
# 冒烟：curl http://localhost:25200/healthz → {"status":"ok","stage":"M0"}
# ==============================================================
services:
  redis:
    image: redis:7-alpine
    container_name: manju-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:16-alpine
    container_name: manju-postgres
    environment:
      POSTGRES_USER: manju
      POSTGRES_PASSWORD: manju_local_dev
      POSTGRES_DB: manju
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    # 注：M0 空壳 API 尚未连接数据库（core/database.py 为 M1 任务），库先行起备

  api:
    build:
      context: ./apps/api
    container_name: manju-api
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "25200:25200"
    depends_on:
      - redis
    restart: unless-stopped

  celery:
    build:
      context: ./apps/api
    container_name: manju-celery
    command: celery -A celery_worker worker --loglevel=info
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
      - api
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: manju-web
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:25200
      NEXT_PUBLIC_GATEWAY_URL: http://localhost:30001
    ports:
      - "20300:20300"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  redis-data:
  pg-data:
